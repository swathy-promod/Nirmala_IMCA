<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District</title>
</head>

<body>
    <h1 align="center">District </h1>
    <form action="" method="post">
        {% csrf_token %} 
        <table border="1" cellpadding="10" align="center">
            <tr>
                <td>District</td>
                <td><input type="text" name="txt_district" id="" value="{{edit.district_name}}"></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" value="Submit"><input type="reset" value="Cancel"></td>

            </tr>
        </table>
    </form>

    <br>
    <table border="1" align="center" cellpadding="8">
        <tr>
            <td>SNO</td>
            <td>District Name</td>
            <td>Action</td>
        </tr>
        {% for i in district %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ i.district_name }}</td>
            <td><a href="{% url 'Admin:deletedistrict' i.id %}">Delete</a>
            <a href="{% url 'Admin:editdistrict' i.id %}">Edit</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
