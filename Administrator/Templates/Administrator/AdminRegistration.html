<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration</title>
</head>

<body>
    <h1 align="center">Admin Registration </h1>

    <form action="" method="post">
        {% csrf_token %}
        <table border="1" align="center" cellpadding="8">
            <tr>
                <td>Name</td>
                <td><input type="text" name="txt_name" id=""></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="txt_email" id=""></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="txt_password" id=""></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                    <input type="reset" value="Cancel">
                </td>
            </tr>
        </table>
    </form>

    <br>
    <table border="1" align="center" cellpadding="8">
        <tr>
            <td>SNO</td>
            <td>Name</td>
            <td>Email</td>
            <td>Password</td>
            <td>Action</td>
        </tr>
        {% for i in admin %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ i.admin_name }}</td>
            <td>{{ i.admin_email }}</td>
            <td>{{ i.admin_password }}</td>
            <td>a href="{% url 'Admin:deleteadmin' i.id %}">Delete</a></td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
