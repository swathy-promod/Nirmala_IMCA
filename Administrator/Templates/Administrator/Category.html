<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category</title>
</head>

<body>
        <h1 align="center">Category </h1>

    <form action="" method="post">
        {% csrf_token %}
        <table  border="1" cellpadding="10" align="center">
            <tr>
                <td>Category</td>
                <td><input type="text" name="txt_category" id=""></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" value="Submit"><input type="reset" value="Cancel"></td>

            </tr>
        </table>
    </form>

    <br>
    <table border="1" align="center" cellpadding="8">
        <tr>
            <td>SNO</td>
            <td>Category Name</td>
            <td>Action</td>
        </tr>
        {% for i in category %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ i.category_name }}</td>
            <td>a href="{% url 'Admin:deletecategory' i.id %}">Delete</a></td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
