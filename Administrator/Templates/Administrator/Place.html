<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place</title>
</head>

<body>
    <form action="" method="post">
        {% csrf_token %}
        <table border="1" cellpadding="8" align="center">
            <tr>
                <td>District</td>
                <td><select name="sel_district" id="">
                        <option value="">-- Select District -- </option>
                        {% for i in district %}
                        <option value="{{i.id}}"  
                        {% if i.id == edit.district_id %} selected {% endif %}
                        >{{i.district_name}}</option>
                        {% endfor %}
                    </select></td>
            </tr>
            <tr>
                <td>Place</td>
                <td><input type="text" name="txt_place" id="" value="{{edit.place_name}}"></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" value="Add"><input type="reset" value="Cancel"></td>

            </tr>
        </table>
    </form>
    <br>
    <table border="1" align="center" cellpadding="8">
        <tr>
            <td>SNO</td>
            <td>District Name</td>
            <td>Place Name</td>
            <td>Action</td>
        </tr>
        {% for i in place %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.district.district_name}}</td>
            <td>{{i.place_name}}</td>
            <td><a href="{% url 'Admin:deleteplace' i.id %}">Delete</a>
            <a href="{% url 'Admin:editplace' i.id %}">Edit</a></td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
