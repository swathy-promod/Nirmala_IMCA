<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UserRegistration</title>
</head>
<body>
    <h1 align="center">UserRegistration</h1>
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
    <table border="2" align="center">
        <tr>
            <td>Name</td>
            <td><input type="text" name="txt_name" id=""></td>
        </tr>
        <tr>
            <td>Email</td>
            <td><input type="email" name="txt_email" id=""></td>
        </tr>
        <tr>
            <td>Contact</td>
            <td><input type="text" name="txt_contact" id=""></td>
        </tr>
        <tr>
            <td>Address</td>
            <td><textarea name="txt_address"></textarea></td>
        </tr>
        <tr>
            <td>District</td>
            <td><select name="sel_district" id="sel_district" onchange="getPlace()">
                <option value="">-- Select District -- </option>
                {% for i in district %}
                <option value="{{i.id}}">{{i.district_name}}</option>
                {% endfor %}

            </select></td>
        </tr>
        <tr>
            <td>Place</td>
            <td><select name="sel_place" id="sel_place">
                <option value="">-- Select Place -- </option>

            </select></td>
        </tr>
        <tr>
            <td>Photo</td>
            <td><input type="file" name="file_photo" id=""></td>
        </tr>
        <tr>
            <td>Password</td>
            <td><input type="password" name="txt_password" id=""></td>
        </tr>
        
       <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Cancel"></td>

            </tr>
    </table>
    </form>
</body>
</html>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
<script>
    function getPlace(){
        let did = document.getElementById("sel_district").value
        var ur = "{% url 'Guest:ajaxplace' %}"
        $.ajax(
            {
              url:ur,
              data: {did : did }  ,
              success : function(data){
                $("#sel_place").html(data);
              },
            });

    }
</script>
