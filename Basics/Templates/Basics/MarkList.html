<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkList</title>
</head>
<body>
    <form action="" method="post" >
        <table border="1" align="center" cellpadding="8">
            <tr>
                <td>First Name</td>
                <td><input type="text" name="txt_fname" id=""></td>
            </tr>
            <tr>
                <td>Last Name</td>
                <td><input type="text" name="txt_lname" id=""></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="txt_gender" id="" value="M"> Male
                    <input type="radio" name="txt_gender" id="" value="F"> Female
                </td>
            </tr>
            <tr>
                <td>Mark 1</td>
                <td><input type="text" name="txt_mark1" id=""></td>
            </tr>
            <tr>
                <td>Mark 2</td>
                <td><input type="text" name="txt_mark2" id=""></td>
            </tr>
            <tr>
                <td>Mark 3</td>
                <td><input type="text" name="txt_mark3" id=""></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Cancel">
                </td>
            </tr>
        </table>
    </form>
    <br>

    <table border="1" align="center" cellpadding="6">
        <tr>
            <td>Full Name</td>
            <td></td>
        </tr>
        <tr>
            <td>Gender</td>
            <td></td>
        </tr>
        <tr>
            <td>Total Mark</td>
            <td></td>
        </tr>
        <tr>
            <td>Percentage</td>
            <td></td>
        </tr>
        <tr>
            <td>Grade</td>
            <td></td>
        </tr>
        
    </table>

</body>
</html>
