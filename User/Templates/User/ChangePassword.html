<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChangePassword</title>
</head>
<body>
    <form action="" method="post">
        {% csrf_token %}
        <table border="2" align="center">
            <tr>
                <td>Old Password</td>
                <td><input type="password" name="txt_oldpass" id=""></td>
            </tr>
            <tr>
                <td>New Password</td>
                <td><input type="password" name="txt_newpass" id=""></td>
            </tr>
            <tr>
                <td>Retype Password</td>
                <td><input type="password" name="txt_retypepass" id=""></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" value="Update"><input type="reset" value="Cancel"></td>
                
            </tr>
        </table>
    </form>
</body>
</html>
